# ============================================================
# X-Road Metrics — PILOTO / TODO EN UNO (un solo host)
# Basado en el docker-compose.yaml oficial de NIIS (carpeta Docker/).
#
# USO: este fichero se ejecuta DENTRO de la carpeta Docker/ del repo
# oficial X-Road-Metrics clonado (reutiliza ./init-generado/* y las
# imágenes locales xroad-metrics-*-module construidas con
# Docker/prepare-containers.sh). Ver README.md de esta carpeta.
#
# Servicios continuos: mongodb, postgresql, corrector, opendata, networking
# Servicios bajo demanda (docker compose run --rm ...):
#   collector_module, reports_module, anonymizer_module
# Perfiles opcionales:  admin (UI de BD, SOLO pruebas) · agregador
# ============================================================
name: xroad-metrics-piloto

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-root_pw}
      - MONGO_INITDB_DATABASE=auth_db
    volumes:
      - ./init-generado/mongodb-init/mongo-init-collector.js:/docker-entrypoint-initdb.d/mongo-init-collector.js:ro
      - ./init-generado/mongodb-init/mongo-init-corrector.js:/docker-entrypoint-initdb.d/mongo-init-corrector.js:ro
      - ./init-generado/mongodb-init/mongo-init-anonymizer.js:/docker-entrypoint-initdb.d/mongo-init-anonymizer.js:ro
      - ./init-generado/mongodb-init/mongo-init-opendata-collector.js:/docker-entrypoint-initdb.d/mongo-init-opendata-collector.js:ro
      - ./init-generado/mongodb-init/mongo-init-reports.js:/docker-entrypoint-initdb.d/mongo-init-reports.js:ro
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - xrd-metrics-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgresql:
    image: postgres:15
    container_name: postgresql
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_ADMIN_USER:-xroadmetrics}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:-postgres_pw}
    volumes:
      - ./init-generado/postgresql-init/init-opendata-db.sql:/docker-entrypoint-initdb.d/init-opendata-db.sql:ro
      - postgresql-data:/var/lib/postgresql/data
    networks:
      - xrd-metrics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-xroadmetrics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector_module:
    image: xroad-metrics-collector-module
    container_name: collector_module
    environment:
      - setting_xroad.instance=${XROAD_INSTANCE:-DEV}
      - setting_xroad.central-server.host=${CENTRAL_SERVER_HOST:-cs}
      - setting_xroad.security-server.host=${SECURITY_SERVER_HOST:-ss0:8080}
      - setting_xroad.monitoring-client.memberclass=${MONITORING_MEMBER_CLASS:-COM}
      - setting_xroad.monitoring-client.membercode=${MONITORING_MEMBER_CODE:-1234}
      - setting_xroad.monitoring-client.subsystemcode=${MONITORING_SUBSYSTEM_CODE:-metrics}
      - setting_collector.records-from-offset=31536000
      - setting_collector.records-to-offset=0
      - setting_mongodb.user=collectordev
      - setting_mongodb.password=${MONGO_COLLECTOR_PASSWORD:-collectordevpw}
      - setting_mongodb.host=mongodb
    networks:
      - xrd-metrics-network
      - xroad-network
    depends_on:
      mongodb:
        condition: service_healthy

  corrector_module:
    image: xroad-metrics-corrector-module
    container_name: corrector_module
    restart: unless-stopped
    environment:
      - setting_xroad.instance=${XROAD_INSTANCE:-DEV}
      - setting_mongodb.user=correctordev
      - setting_mongodb.password=${MONGO_CORRECTOR_PASSWORD:-correctordevpw}
      - setting_mongodb.host=mongodb
      - setting_corrector.wait-on-done=60
      - setting_corrector.wait-on-error=60
    networks:
      - xrd-metrics-network
    depends_on:
      mongodb:
        condition: service_healthy

  reports_module:
    image: xroad-metrics-reports-module
    container_name: reports_module
    environment:
      - setting_xroad.instance=${XROAD_INSTANCE:-DEV}
      - setting_mongodb.user=reportsdev
      - setting_mongodb.password=${MONGO_REPORTS_PASSWORD:-reportsdevpw}
      - setting_mongodb.host=mongodb
      - setting_reports.email.sender=${REPORTS_EMAIL_SENDER:-test@x-road.global}
      - setting_reports.email.smtp.host=${REPORTS_SMTP_HOST:-localhost}
    volumes:
      - reports-data:/var/lib/xroad-metrics/reports
    networks:
      - xrd-metrics-network
    depends_on:
      mongodb:
        condition: service_healthy

  anonymizer_module:
    image: xroad-metrics-anonymizer-module
    container_name: anonymizer_module
    environment:
      - setting_xroad.instance=${XROAD_INSTANCE:-DEV}
      - setting_xroad.central-server.host=${CENTRAL_SERVER_HOST:-cs}
      - setting_mongodb.user=anonymizerdev
      - setting_mongodb.password=${MONGO_ANONYMIZER_PASSWORD:-anonymizerdevpw}
      - setting_mongodb.host=mongodb
      - setting_postgres.user=anonymizer_${INSTANCE_LOWER:-dev}
      - setting_postgres.password=${PG_ANONYMIZER_PASSWORD:-anonymizer_devsecret}
      - setting_postgres.host=postgresql
      - setting_postgres.database-name=opendata_${INSTANCE_LOWER:-dev}
      - setting_postgres.readonly-users=["opendata_${INSTANCE_LOWER:-dev}", "networking_${INSTANCE_LOWER:-dev}"]
    networks:
      - xrd-metrics-network
      - xroad-network
    depends_on:
      mongodb:
        condition: service_healthy
      postgresql:
        condition: service_healthy

  opendata_module:
    image: xroad-metrics-opendata-module
    container_name: opendata_module
    restart: unless-stopped
    environment:
      - setting_xroad.instance=${XROAD_INSTANCE:-DEV}
      - setting_postgres.user=opendata_${INSTANCE_LOWER:-dev}
      - setting_postgres.password=${PG_OPENDATA_PASSWORD:-opendata_devsecret}
      - setting_postgres.database-name=opendata_${INSTANCE_LOWER:-dev}
      - setting_postgres.host=postgresql
      - setting_opendata.delay-days=${OPENDATA_DELAY_DAYS:-0}
      - setting_django.secret-key=${DJANGO_SECRET_KEY:-secret}
    ports:
      - "${OPENDATA_BIND_IP:-127.0.0.1}:${OPENDATA_PORT:-8000}:80"
    networks:
      - xrd-metrics-network
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  networking_module:
    image: xroad-metrics-networking-module
    container_name: networking_module
    restart: unless-stopped
    platform: linux/amd64
    environment:
      - setting_xroad.instance=${XROAD_INSTANCE:-DEV}
      - setting_postgres.host=postgresql
      - setting_postgres.port=5432
      - setting_postgres.username=networking_${INSTANCE_LOWER:-dev}
      - setting_postgres.password=${PG_NETWORKING_PASSWORD:-networking_devsecret}
      - setting_networking.buffer=0
    ports:
      - "${NETWORKING_BIND_IP:-127.0.0.1}:${NETWORKING_PORT:-8001}:3838"
    networks:
      - xrd-metrics-network
    depends_on:
      postgresql:
        condition: service_healthy
      anonymizer_module:
        condition: service_started
        required: false

  opendata_collector_module:
    image: xroad-metrics-opendata-collector-module
    container_name: opendata_collector_module
    profiles: ["agregador"]
    environment:
      - setting_xroad.instance=${XROAD_INSTANCE:-DEV}
      - setting_mongodb.user=opendatacollectordev
      - setting_mongodb.password=${MONGO_OPENDATA_COLLECTOR_PASSWORD:-opendatacollectordevpw}
      - setting_mongodb.host=mongodb
    networks:
      - xrd-metrics-network
    depends_on:
      mongodb:
        condition: service_healthy

  # --- Administración de BD: SOLO para pruebas locales, nunca en producción ---
  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: mongo-express
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_ROOT_USER:-root}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_ROOT_PASSWORD:-root_pw}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-root_pw}@mongodb:27017/?authSource=admin
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - xrd-metrics-network
    depends_on:
      mongodb:
        condition: service_healthy

  adminer:
    image: adminer:5.4.1
    container_name: adminer
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgresql
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - xrd-metrics-network

networks:
  xrd-metrics-network:
    name: xrd-metrics-network
    driver: bridge
  # Red de la pila X-Road (xrd-dev-stack) u otra red externa equivalente.
  # desplegar.sh la crea vacía si no existe.
  xroad-network:
    external: true

volumes:
  mongodb-data:
  mongodb-config:
  postgresql-data:
  reports-data:
